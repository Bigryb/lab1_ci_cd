name: Basic CI - Factorial

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  basic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build - create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Test - run unittest
        run: .venv/bin/python -m unittest discover -s tests -p "test_factorial_unittest.py" -v